services:
  feiying:
    build: .
    image: feiying:latest
    container_name: feiying
    restart: unless-stopped
    user: "1000:1001"
    ports:
      - "8099:8099"
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
      - DOWNLOAD_ROOTS=/media
      - PORT=8099
    volumes:
      - ./data:/app/data
      - ${MEDIA_DIR:-./media}:/media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8099/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3